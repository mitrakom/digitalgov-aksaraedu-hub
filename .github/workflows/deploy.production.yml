name: CI Tests & Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hub-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ========================================================
  # JOB 1: TEST & CI QUALITY CHECK
  # ========================================================
  test:
    name: Run Quality & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,ctype,fileinfo,gd,xml,curl,zip,openssl,pdo_mysql,pdo_pgsql,redis,bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Application Dependencies
        run: |
          composer install --prefer-dist --no-interaction
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          npm ci --include=dev

      - name: Run CI Checks & Tests
        run: composer ci:check

  # ========================================================
  # JOB 2: BUILD, PACKAGE & DEPLOY TO HOSTING
  # (Hanya dijalankan jika Job 1 / Test Lolos 100%)
  # ========================================================
  deploy:
    name: Build, Package & Deploy Central Hub
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup PHP 8.3 with required extensions for Central Hub
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,ctype,fileinfo,gd,xml,curl,zip,openssl,pdo_mysql,pdo_pgsql,redis,bcmath
          tools: composer:v2
          coverage: none

      # Step 3: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 4: Install Composer dependencies (Production optimized)
      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # Step 5: Install Node dependencies & Build frontend assets
      - name: Install Node dependencies & Build frontend assets
        run: |
          if [ -f pnpm-lock.yaml ]; then
            npm install -g pnpm
            pnpm install --frozen-lockfile
            pnpm run build
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
            yarn build
          else
            npm ci --include=dev
            npm run build
          fi

      # Step 6: Generate dynamic application version (CalVer + Time WITA / Makassar)
      - name: Generate dynamic application version (CalVer + Time WITA)
        run: |
          VERSION_TAG=$(TZ='Asia/Makassar' date +'v%Y.%m.%d.%H%M')
          BUILD_TIME=$(TZ='Asia/Makassar' date -Iseconds)
          FORMATTED_TIME=$(TZ='Asia/Makassar' date +'%d %b %Y, %H:%M WITA')
          echo "APP_VERSION=$VERSION_TAG" >> $GITHUB_ENV
          echo "🏷️ Menetapkan versi otomatis (WITA): $VERSION_TAG"
          
          # Tulis ke version.json
          echo "{\"version\": \"${VERSION_TAG}\", \"build_at\": \"${BUILD_TIME}\", \"formatted_time\": \"${FORMATTED_TIME}\"}" > version.json
          
          # Jika ada config/version.php, perbarui string versi
          if [ -f config/version.php ]; then
            sed -i "s/'string' => .*/'string' => '${VERSION_TAG}',/" config/version.php
          fi

      # Step 7: Package application into deploy.zip (AksaraEdu Central Hub Package)
      - name: Create deploy.zip archive
        run: |
          echo "📦 Mengompres AksaraEdu Central Hub ke deploy.zip (Versi: ${{ env.APP_VERSION }})..."
          zip -r -q deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".env*" \
            -x ".agents/*" \
            -x ".gemini/*" \
            -x ".claude/*" \
            -x ".cursor/*" \
            -x ".windsurf/*" \
            -x ".cortex/*" \
            -x "skills/*" \
            -x "rules/*" \
            -x "plugins/*" \
            -x "boost.json" \
            -x "AGENTS.md" \
            -x "CLAUDE.md" \
            -x "GEMINI.md" \
            -x "COPILOT.md" \
            -x "PROMPT.md" \
            -x "tests/*" \
            -x "database/factories/*" \
            -x ".phpunit.cache/*" \
            -x "phpunit.xml*" \
            -x "pest.php" \
            -x "node_modules/*" \
            -x "storage/logs/*" \
            -x "storage/keys/*" \
            -x "storage/media-library/*" \
            -x "storage/app/public/*" \
            -x "storage/app/private/*" \
            -x "storage/app/updates/*" \
            -x "storage/pail/*" \
            -x "storage/*.sqlite*" \
            -x "bootstrap/cache/*" \
            -x "scratch/*" \
            -x "docs/*" \
            -x "user_guides/*" \
            -x "mkdocs.yml" \
            -x "README.md" \
            -x "*.log" \
            -x "*.tar.gz"

          ZIP_SIZE=$(du -sh deploy.zip | cut -f1)
          echo "✓ deploy.zip berhasil dibuat (Ukuran: $ZIP_SIZE)"

      # Step 8: Upload deploy.zip via FTP (Only 1 file uploaded - Fast & 100% reliable)
      - name: Upload deploy.zip to Production FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_PROD_HOST }}
          username: ${{ secrets.FTP_PROD_USER }}
          password: ${{ secrets.FTP_PROD_PASSWORD }}
          port: ${{ secrets.FTP_PROD_PORT || 21 }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || './hub/' }}
          dangerous-clean-slate: false
          protocol: ftp
          security: loose
          timeout: 300000
          log-level: standard
          exclude: |
            **
            !deploy.zip

      # Step 9: Trigger Webhook (Auto-extract deploy.zip + migrate + cache optimizations)
      - name: Trigger Post-Deploy Webhook (Auto-Extract, Migrate & Cache)
        run: |
          echo "🔄 Mengirim sinyal webhook untuk auto-extract, database migration, dan cache update Central Hub..."
          if [ -z "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" ]; then
            echo "⚠️ PERINGATAN: DEPLOY_WEBHOOK_SECRET belum diisi di GitHub Secrets."
            echo "File deploy.zip telah ter-upload, namun auto-extract & migrasi otomatis tidak terpanggil."
          else
            TARGET_WEBHOOK_URL="${{ secrets.DEPLOY_WEBHOOK_URL || 'https://hub.aksaraedu.id/api/deploy-webhook' }}"
            echo "Mengirim request ke: $TARGET_WEBHOOK_URL"
            
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "{\"token\":\"${{ secrets.DEPLOY_WEBHOOK_SECRET }}\"}" \
              "$TARGET_WEBHOOK_URL")

            HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS:.*//g')
            HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

            echo "Response Status: $HTTP_STATUS"
            echo "Response Body: $HTTP_BODY"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✓ deploy.zip berhasil diekstrak, migrasi database & optimasi cache Central Hub sukses!"
            elif [ "$HTTP_STATUS" -eq 403 ]; then
              echo "⚠️ PERINGATAN: Endpoint webhook ditolak (HTTP 403) atau diblokir oleh WAF/Imunify360 Bot-Protection."
              echo "ℹ️ INFO: File deploy.zip telah sukses ter-upload via FTP."
              echo "💡 Solusi: Periksa kecocokan DEPLOY_WEBHOOK_SECRET di .env server atau ekstrak manual deploy.zip."
            else
              echo "❌ ERROR: Webhook deployment gagal (HTTP $HTTP_STATUS)"
              exit 1
            fi
          fi
        continue-on-error: true

      # Step 10: Verify deployed assets
      - name: Verify deployed assets
        run: |
          TARGET_MANIFEST_URL="${{ secrets.DEPLOY_MANIFEST_URL || 'https://hub.aksaraedu.id/build/manifest.json' }}"
          response=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_MANIFEST_URL")
          if [ "$response" != "200" ]; then
            echo "⚠️ Asset manifest check returned: $response"
          else
            echo "✓ Production assets verified successfully ($response)"
          fi
        continue-on-error: true

      # Step 11: Deployment summary
      - name: Deployment summary
        if: always()
        run: |
          echo "================================================"
          echo "📊 STATUS DEPLOYMENT: ${{ job.status }}"
          echo "🏷️ Versi Rilis:     ${{ env.APP_VERSION }}"
          echo "🏢 Aplikasi:        AksaraEdu Central Hub (Vendor HQ)"
          echo "🌐 Target URL:      https://hub.aksaraedu.id"
          echo "📌 Commit:          ${{ github.sha }}"
          echo "👤 Actor:           ${{ github.actor }}"
          echo "================================================"
