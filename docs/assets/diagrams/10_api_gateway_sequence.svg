<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .actor-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .seq-text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1e293b; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="960" height="480" fill="#f8fafc" rx="16" />

  <text x="40" y="45" class="title">Diagram Interaksi REST API Gateway Central Hub</text>
  <text x="40" y="68" class="subtitle">Protokol Komunikasi REST API Gateway Antara LMS Sekolah dan Vendor Hub HQ</text>

  <!-- 3 ACTORS -->
  <!-- Actor 1: LMS Sekolah -->
  <g transform="translate(60, 95)">
    <rect width="200" height="40" rx="8" fill="#0284c7" />
    <text x="100" y="25" text-anchor="middle" class="actor-title">🏫 Instans LMS Sekolah</text>
    <line x1="100" y1="40" x2="100" y2="350" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Actor 2: API Gateway -->
  <g transform="translate(380, 95)">
    <rect width="200" height="40" rx="8" fill="#1e293b" />
    <text x="100" y="25" text-anchor="middle" class="actor-title">🚪 API Gateway /api/v1</text>
    <line x1="100" y1="40" x2="100" y2="350" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Actor 3: Hub Backend & DB -->
  <g transform="translate(700, 95)">
    <rect width="200" height="40" rx="8" fill="#16a34a" />
    <text x="100" y="25" text-anchor="middle" class="actor-title">🗄️ Hub Licensing Engine</text>
    <line x1="100" y1="40" x2="100" y2="350" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- SEQUENCE CALLS -->
  <!-- Call 1: Activate -->
  <g transform="translate(160, 160)">
    <line x1="0" y1="0" x2="320" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="30" y="-18" width="260" height="18" rx="4" fill="#e0f2fe" />
    <text x="160" y="-5" text-anchor="middle" class="seq-text">1. POST /api/v1/license/activate</text>
  </g>

  <g transform="translate(480, 190)">
    <line x1="320" y1="0" x2="0" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="40" y="-18" width="240" height="18" rx="4" fill="#dcfce7" />
    <text x="160" y="-5" text-anchor="middle" class="seq-text">200 OK (Signed RSA Payload)</text>
  </g>

  <!-- Call 2: Heartbeat -->
  <g transform="translate(160, 240)">
    <line x1="0" y1="0" x2="320" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="25" y="-18" width="270" height="18" rx="4" fill="#e0f2fe" />
    <text x="160" y="-5" text-anchor="middle" class="seq-text">2. POST /api/v1/license/heartbeat (24 Jam)</text>
  </g>

  <g transform="translate(480, 270)">
    <line x1="320" y1="0" x2="0" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="50" y="-18" width="220" height="18" rx="4" fill="#dcfce7" />
    <text x="160" y="-5" text-anchor="middle" class="seq-text">200 OK (Status &amp; Broadcast)</text>
  </g>

  <!-- Call 3: Updates Check -->
  <g transform="translate(160, 320)">
    <line x1="0" y1="0" x2="320" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="35" y="-18" width="250" height="18" rx="4" fill="#e0f2fe" />
    <text x="160" y="-5" text-anchor="middle" class="seq-text">3. GET /api/v1/updates/check</text>
  </g>

  <g transform="translate(480, 350)">
    <line x1="320" y1="0" x2="0" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="40" y="-18" width="240" height="18" rx="4" fill="#dcfce7" />
    <text x="160" y="-5" text-anchor="middle" class="seq-text">200 OK (Changelog &amp; SHA-256)</text>
  </g>

  <!-- Bottom Rate Limiting Note -->
  <g transform="translate(40, 400)" filter="url(#shadow)">
    <rect width="880" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="25" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a">🛡️ KEAMANAN &amp; RATE LIMITING GATEWAY</text>
    <text x="25" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#64748b">Aktivasi: max 30 req/menit • Heartbeat &amp; Update Check: max 60 req/menit • Demo Generator: max 20 req/menit.</text>
  </g>
</svg>
