<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .phase-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .card-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .card-desc { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
      .badge { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <text x="40" y="45" class="title">SOP Deployment LMS Klien - Model Beli Putus (On-Premise)</text>
  <text x="40" y="68" class="subtitle">Diagram Alur 4 Tahap Instalasi Server Sekolah, Kriptografi Lisensi, Uji Beban CBT &amp; Serah Terima BAST</text>

  <!-- PHASE 1: PERSIAPAN & AUDIT -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="205" height="480" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <rect x="0" y="0" width="205" height="36" rx="12" fill="#0284c7" />
    <rect x="0" y="24" width="205" height="12" fill="#0284c7" />
    <text x="102" y="23" text-anchor="middle" fill="#ffffff" class="phase-title">TAHAP 1: PERSIAPAN</text>

    <!-- Card 1.1 -->
    <g transform="translate(12, 50)">
      <rect width="181" height="90" rx="8" fill="#f0f9ff" stroke="#bae6fd" />
      <text x="12" y="25" class="card-title">🔍 1.1. Audit Server</text>
      <text x="12" y="45" class="card-desc">Cek CPU (min 4 core),</text>
      <text x="12" y="60" class="card-desc">RAM 8GB, SSD NVMe</text>
      <text x="12" y="75" class="card-desc">&amp; Topologi Jaringan LAN</text>
    </g>

    <!-- Arrow down -->
    <path d="M 102 145 L 102 175" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- Card 1.2 -->
    <g transform="translate(12, 185)">
      <rect width="181" height="90" rx="8" fill="#f0f9ff" stroke="#bae6fd" />
      <text x="12" y="25" class="card-title">🐧 1.2. Setup OS</text>
      <text x="12" y="45" class="card-desc">Fresh install Ubuntu</text>
      <text x="12" y="60" class="card-desc">Server 22.04/24.04 LTS</text>
      <text x="12" y="75" class="card-desc">&amp; Konfigurasi IP Statik</text>
    </g>

    <!-- Arrow down -->
    <path d="M 102 280 L 102 310" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- Card 1.3 -->
    <g transform="translate(12, 320)">
      <rect width="181" height="90" rx="8" fill="#f0f9ff" stroke="#bae6fd" />
      <text x="12" y="25" class="card-title">🛡️ 1.3. Hardening</text>
      <text x="12" y="45" class="card-desc">Setup UFW Firewall,</text>
      <text x="12" y="60" class="card-desc">SSH Key-Only Auth</text>
      <text x="12" y="75" class="card-desc">&amp; Disable Root Login</text>
    </g>
  </g>

  <!-- Connect Phase 1 to Phase 2 -->
  <path d="M 245 335 L 265 335" fill="none" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-blue)" />

  <!-- PHASE 2: INSTALASI STACK & CORE LMS -->
  <g transform="translate(270, 95)" filter="url(#shadow)">
    <rect width="205" height="480" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" />
    <rect x="0" y="0" width="205" height="36" rx="12" fill="#d97706" />
    <rect x="0" y="24" width="205" height="12" fill="#d97706" />
    <text x="102" y="23" text-anchor="middle" fill="#ffffff" class="phase-title">TAHAP 2: INSTALASI</text>

    <!-- Card 2.1 -->
    <g transform="translate(12, 50)">
      <rect width="181" height="90" rx="8" fill="#fffbeb" stroke="#fde68a" />
      <text x="12" y="25" class="card-title">📦 2.1. Software Stack</text>
      <text x="12" y="45" class="card-desc">Nginx 1.24+, PHP 8.3-FPM</text>
      <text x="12" y="60" class="card-desc">MariaDB / PostgreSQL</text>
      <text x="12" y="75" class="card-desc">&amp; Redis Cache 7.x</text>
    </g>

    <path d="M 102 145 L 102 175" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)" />

    <!-- Card 2.2 -->
    <g transform="translate(12, 185)">
      <rect width="181" height="90" rx="8" fill="#fffbeb" stroke="#fde68a" />
      <text x="12" y="25" class="card-title">📂 2.2. Extract Package</text>
      <text x="12" y="45" class="card-desc">Deploy arsip rilis ke</text>
      <text x="12" y="60" class="card-desc">/var/www/aksaraedu-lms</text>
      <text x="12" y="75" class="card-desc">Set permission www-data</text>
    </g>

    <path d="M 102 280 L 102 310" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)" />

    <!-- Card 2.3 -->
    <g transform="translate(12, 320)">
      <rect width="181" height="90" rx="8" fill="#fffbeb" stroke="#fde68a" />
      <text x="12" y="25" class="card-title">🗄️ 2.3. DB Migration</text>
      <text x="12" y="45" class="card-desc">Konfigurasi .env</text>
      <text x="12" y="60" class="card-desc">php artisan migrate</text>
      <text x="12" y="75" class="card-desc">&amp; Inisialisasi Database</text>
    </g>
  </g>

  <!-- Connect Phase 2 to Phase 3 -->
  <path d="M 475 335 L 495 335" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)" />

  <!-- PHASE 3: KRIPTOGRAFI LISENSI -->
  <g transform="translate(500, 95)" filter="url(#shadow)">
    <rect width="205" height="480" rx="12" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5" />
    <rect x="0" y="0" width="205" height="36" rx="12" fill="#9333ea" />
    <rect x="0" y="24" width="205" height="12" fill="#9333ea" />
    <text x="102" y="23" text-anchor="middle" fill="#ffffff" class="phase-title">TAHAP 3: LISENSI RSA</text>

    <!-- Card 3.1 -->
    <g transform="translate(12, 50)">
      <rect width="181" height="90" rx="8" fill="#faf5ff" stroke="#e9d5ff" />
      <text x="12" y="25" class="card-title">📥 3.1. Unduh .LIC</text>
      <text x="12" y="45" class="card-desc">Download file lisensi</text>
      <text x="12" y="60" class="card-desc">dari Central Hub HQ</text>
      <text x="12" y="75" class="card-desc">sesuai NPSN sekolah</text>
    </g>

    <path d="M 102 145 L 102 175" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- Card 3.2 -->
    <g transform="translate(12, 185)">
      <rect width="181" height="90" rx="8" fill="#faf5ff" stroke="#e9d5ff" />
      <text x="12" y="25" class="card-title">🔑 3.2. Injeksi Lisensi</text>
      <text x="12" y="45" class="card-desc">Simpan di direktori:</text>
      <text x="12" y="60" class="card-desc">storage/license/</text>
      <text x="12" y="75" class="card-desc">aksaraedu.lic (chmod 644)</text>
    </g>

    <path d="M 102 280 L 102 310" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-blue)" />

    <!-- Card 3.3 -->
    <g transform="translate(12, 320)">
      <rect width="181" height="90" rx="8" fill="#faf5ff" stroke="#e9d5ff" />
      <text x="12" y="25" class="card-title">🛡️ 3.3. Cek Offline</text>
      <text x="12" y="45" class="card-desc">Verifikasi Signature RSA</text>
      <text x="12" y="60" class="card-desc">secara lokal tanpa butuh</text>
      <text x="12" y="75" class="card-desc">koneksi internet</text>
    </g>
  </g>

  <!-- Connect Phase 3 to Phase 4 -->
  <path d="M 705 335 L 725 335" fill="none" stroke="#9333ea" stroke-width="3" marker-end="url(#arrow-blue)" />

  <!-- PHASE 4: TESTING & GO-LIVE -->
  <g transform="translate(730, 95)" filter="url(#shadow)">
    <rect width="190" height="480" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="36" rx="12" fill="#16a34a" />
    <rect x="0" y="24" width="190" height="12" fill="#16a34a" />
    <text x="95" y="23" text-anchor="middle" fill="#ffffff" class="phase-title">TAHAP 4: GO-LIVE</text>

    <!-- Card 4.1 -->
    <g transform="translate(10, 50)">
      <rect width="170" height="90" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="10" y="25" class="card-title">⚡ 4.1. Uji Beban CBT</text>
      <text x="10" y="45" class="card-desc">Simulasi serentak 100+</text>
      <text x="10" y="60" class="card-desc">siswa submit ujian</text>
      <text x="10" y="75" class="card-desc">Verifikasi Redis &amp; Queue</text>
    </g>

    <path d="M 95 145 L 95 175" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />

    <!-- Card 4.2 -->
    <g transform="translate(10, 185)">
      <rect width="170" height="90" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="10" y="25" class="card-title">📋 4.2. UAT Sekolah</text>
      <text x="10" y="45" class="card-desc">Pengujian fitur rapor,</text>
      <text x="10" y="60" class="card-desc">materi, presensi oleh</text>
      <text x="10" y="75" class="card-desc">tim kurikulum &amp; IT</text>
    </g>

    <path d="M 95 280 L 95 310" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />

    <!-- Card 4.3 (BAST) -->
    <g transform="translate(10, 320)">
      <rect width="170" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
      <text x="10" y="25" class="card-title">📝 4.3. BAST &amp; Handover</text>
      <text x="10" y="45" class="card-desc">• Tanda Tangan BAST</text>
      <text x="10" y="65" class="card-desc">• Serah Akses Root/DB</text>
      <text x="10" y="85" class="card-desc">• Garansi 3 Bulan Aktif</text>
      <rect x="10" y="98" width="150" height="22" rx="4" fill="#16a34a" />
      <text x="85" y="113" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">🎉 RESMI PRODUKSI</text>
    </g>
  </g>
</svg>
