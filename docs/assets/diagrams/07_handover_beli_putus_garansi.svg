<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .actor-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .seq-text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1e293b; }
      .note-text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #0369a1; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="960" height="480" fill="#f8fafc" rx="16" />

  <text x="40" y="45" class="title">Protokol Serah Terima Beli Putus &amp; Garansi Bugfix 3 Bulan</text>
  <text x="40" y="68" class="subtitle">Urutan Interaksi Serah Terima Kredensial Server, Uji UAT, BAST &amp; Hitung Mundur Garansi</text>

  <!-- 3 ACTORS -->
  <!-- Actor 1: Tim Vendor -->
  <g transform="translate(60, 95)">
    <rect width="180" height="40" rx="8" fill="#1e293b" />
    <text x="90" y="25" text-anchor="middle" class="actor-title">🏢 Lead Vendor</text>
    <line x1="90" y1="40" x2="90" y2="360" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Actor 2: Server Sekolah -->
  <g transform="translate(390, 95)">
    <rect width="180" height="40" rx="8" fill="#0284c7" />
    <text x="90" y="25" text-anchor="middle" class="actor-title">🖥️ Server Sekolah</text>
    <line x1="90" y1="40" x2="90" y2="360" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Actor 3: Tim Sekolah -->
  <g transform="translate(720, 95)">
    <rect width="180" height="40" rx="8" fill="#16a34a" />
    <text x="90" y="25" text-anchor="middle" class="actor-title">🏫 Kepala &amp; IT Sekolah</text>
    <line x1="90" y1="40" x2="90" y2="360" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- SEQUENCE STEPS -->
  <!-- Step 1: Deploy & Injeksi Lisensi -->
  <g transform="translate(150, 160)">
    <line x1="0" y1="0" x2="320" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="50" y="-18" width="230" height="18" rx="4" fill="#e0f2fe" />
    <text x="165" y="-5" text-anchor="middle" class="seq-text">1. Deploy &amp; Injeksi aksaraedu.lic</text>
  </g>

  <!-- Step 2: Serah Kredensial -->
  <g transform="translate(150, 205)">
    <line x1="0" y1="0" x2="650" y2="0" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="180" y="-18" width="300" height="18" rx="4" fill="#e0f2fe" />
    <text x="330" y="-5" text-anchor="middle" class="seq-text">2. Serah Kredensial Root SSH &amp; Superadmin LMS</text>
  </g>

  <!-- Step 3: Ganti Password Mandiri -->
  <g transform="translate(480, 250)">
    <line x1="320" y1="0" x2="0" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="60" y="-18" width="210" height="18" rx="4" fill="#dcfce7" />
    <text x="165" y="-5" text-anchor="middle" class="seq-text">3. Ganti Password Root Mandiri</text>
  </g>

  <!-- Step 4: UAT Bersama -->
  <g transform="translate(150, 295)">
    <line x1="650" y1="0" x2="0" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="190" y="-18" width="270" height="18" rx="4" fill="#dcfce7" />
    <text x="325" y="-5" text-anchor="middle" class="seq-text">4. Pengujian UAT (CBT, Rapor, Presensi) Lolos</text>
  </g>

  <!-- Step 5: Tanda Tangan BAST & Garansi Aktif -->
  <g transform="translate(150, 340)">
    <line x1="650" y1="0" x2="0" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
    <rect x="180" y="-18" width="290" height="18" rx="4" fill="#dcfce7" />
    <text x="325" y="-5" text-anchor="middle" class="seq-text">5. Tanda Tangan BAST 2 Rangkap Bermaterai</text>
  </g>

  <!-- Bottom Warranty Banner -->
  <g transform="translate(40, 390)" filter="url(#shadow)">
    <rect width="880" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" />
    <text x="25" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#b45309">🛡️ KETENTUAN GARANSI BUGFIX 3 BULAN (TERHITUNG SEJAK TANGGAL BAST)</text>
    <text x="25" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#78350f">Mencakup perbaikan bug logika, error kalkulasi nilai rapor, dan security patch rilis. Tidak mencakup kerusakan hardware atau modifikasi kode mandiri.</text>
  </g>
</svg>
