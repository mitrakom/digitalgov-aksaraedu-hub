<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .card-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .card-desc { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; }
      .badge { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="960" height="460" fill="#f8fafc" rx="16" />

  <text x="40" y="45" class="title">SOP Provisi Cloud &amp; Siklus Telemetri 24 Jam (SaaS)</text>
  <text x="40" y="68" class="subtitle">Alur Otomasi Registrasi Klien Cloud, Injeksi Token API &amp; Sinkronisasi Heartbeat Terkelola</text>

  <!-- Step 1: Central Hub Registration -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="260" height="320" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="36" rx="12" fill="#0284c7" />
    <rect x="0" y="24" width="260" height="12" fill="#0284c7" />
    <text x="130" y="23" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">1. CENTRAL HUB (VENDOR HQ)</text>

    <g transform="translate(15, 50)">
      <circle cx="15" cy="15" r="14" fill="#e0f2fe" />
      <text x="15" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">A</text>
      <text x="38" y="14" class="card-title">Registrasi Klien SaaS</text>
      <text x="38" y="30" class="card-desc">Input NPSN &amp; Profil Sekolah</text>
    </g>

    <g transform="translate(15, 120)">
      <circle cx="15" cy="15" r="14" fill="#e0f2fe" />
      <text x="15" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">B</text>
      <text x="38" y="14" class="card-title">Terbitkan API Token</text>
      <text x="38" y="30" class="card-desc">aksr_live_9a8b7c6d5e4f...</text>
    </g>

    <g transform="translate(15, 190)">
      <circle cx="15" cy="15" r="14" fill="#e0f2fe" />
      <text x="15" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">C</text>
      <text x="38" y="14" class="card-title">Set Expiry (+1 Tahun)</text>
      <text x="38" y="30" class="card-desc">Grace period 14 hari disiapkan</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 300 250 L 340 250" fill="none" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Step 2: Cloud Instance Provisioning -->
  <g transform="translate(350, 100)" filter="url(#shadow)">
    <rect width="260" height="320" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="36" rx="12" fill="#334155" />
    <rect x="0" y="24" width="260" height="12" fill="#334155" />
    <text x="130" y="23" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">2. CLOUD PROVISIONING</text>

    <g transform="translate(15, 50)">
      <circle cx="15" cy="15" r="14" fill="#f1f5f9" />
      <text x="15" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">A</text>
      <text x="38" y="14" class="card-title">Subdomain &amp; SSL</text>
      <text x="38" y="30" class="card-desc">sekolah.aksaraedu.id (HTTPS)</text>
    </g>

    <g transform="translate(15, 120)">
      <circle cx="15" cy="15" r="14" fill="#f1f5f9" />
      <text x="15" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">B</text>
      <text x="38" y="14" class="card-title">Inject Environment</text>
      <text x="38" y="30" class="card-desc">AKSARAHUB_LICENSE_TOKEN</text>
    </g>

    <g transform="translate(15, 190)">
      <circle cx="15" cy="15" r="14" fill="#f1f5f9" />
      <text x="15" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">C</text>
      <text x="38" y="14" class="card-title">Auto-Backup S3</text>
      <text x="38" y="30" class="card-desc">Snapshot DB harian otomatis</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 610 250 L 650 250" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)" />

  <!-- Step 3: Daily Sync & Telemetry -->
  <g transform="translate(660, 100)" filter="url(#shadow)">
    <rect width="260" height="320" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="36" rx="12" fill="#16a34a" />
    <rect x="0" y="24" width="260" height="12" fill="#16a34a" />
    <text x="130" y="23" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">3. SIKLUS OPERASIONAL 24 JAM</text>

    <g transform="translate(15, 50)">
      <circle cx="15" cy="15" r="14" fill="#dcfce7" />
      <text x="15" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">1</text>
      <text x="38" y="14" class="card-title">Ping Heartbeat Harian</text>
      <text x="38" y="30" class="card-desc">Kirim total siswa, guru &amp; CBT</text>
    </g>

    <g transform="translate(15, 120)">
      <circle cx="15" cy="15" r="14" fill="#dcfce7" />
      <text x="15" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">2</text>
      <text x="38" y="14" class="card-title">Cek Status &amp; Pengumuman</text>
      <text x="38" y="30" class="card-desc">Menerima broadcast vendor</text>
    </g>

    <g transform="translate(15, 190)">
      <circle cx="15" cy="15" r="14" fill="#dcfce7" />
      <text x="15" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">3</text>
      <text x="38" y="14" class="card-title">Auto-Patch Updates</text>
      <text x="38" y="30" class="card-desc">Fitur &amp; bugfix otomatis update</text>
    </g>
  </g>
</svg>
