<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .card-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #1e293b; }
      .card-desc { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #475569; }
      .badge { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="960" height="520" fill="#f8fafc" rx="16" />

  <text x="40" y="45" class="title">Manajemen Operasional Vendor &amp; Matriks SLA Helpdesk</text>
  <text x="40" y="68" class="subtitle">Aturan Penerbitan Lisensi, Kuota Reset Hardware (Maks 3x) &amp; Klasifikasi Tingkat Prioritas Respon Tiket</text>

  <!-- LEFT: LICENSE & HARDWARE RESET LOGIC -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="420" height="385" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <rect x="0" y="0" width="420" height="36" rx="12" fill="#0284c7" />
    <rect x="0" y="24" width="420" height="12" fill="#0284c7" />
    <text x="20" y="23" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">🔑 LOGIKA OPERASIONAL LISENSI VENDOR</text>

    <!-- Sub 1: Issue License -->
    <g transform="translate(20, 50)">
      <rect width="380" height="85" rx="8" fill="#f0f9ff" stroke="#bae6fd" />
      <text x="15" y="25" class="card-title">1. Penerbitan Lisensi Baru</text>
      <text x="15" y="45" class="card-desc">• Input NPSN, Nama Sekolah, &amp; Model Lisensi</text>
      <text x="15" y="62" class="card-desc">• Auto-generate Serial Key &amp; Tanda Tangan RSA</text>
    </g>

    <!-- Sub 2: Hardware Reset Quota -->
    <g transform="translate(20, 150)">
      <rect width="380" height="110" rx="8" fill="#fffbeb" stroke="#fde68a" />
      <text x="15" y="25" class="card-title">2. Reset Hardware Fingerprint</text>
      <text x="15" y="45" class="card-desc">• Kuota Mandiri: <tspan font-weight="700" fill="#b45309">Maksimal 3 Kali / Tahun</tspan></text>
      <text x="15" y="62" class="card-desc">• Counter bertambah otomatis di database</text>
      <text x="15" y="80" class="card-desc">• Melebihi 3x wajib surat resmi Kepala Sekolah</text>
    </g>

    <!-- Sub 3: Release Patch Distribution -->
    <g transform="translate(20, 275)">
      <rect width="380" height="85" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="15" y="25" class="card-title">3. Repositori Rilis &amp; Patch</text>
      <text x="15" y="45" class="card-desc">• Hitung Checksum SHA-256 untuk proteksi file</text>
      <text x="15" y="62" class="card-desc">• Klien garansi berhak unduh patch bugfix gratis</text>
    </g>
  </g>

  <!-- RIGHT: HELPDESK SLA MATRIX -->
  <g transform="translate(500, 95)" filter="url(#shadow)">
    <rect width="420" height="385" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="420" height="36" rx="12" fill="#1e293b" />
    <rect x="0" y="24" width="420" height="12" fill="#1e293b" />
    <text x="20" y="23" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">🎫 MATRIKS SLA TIKET HELPDESK</text>

    <!-- Priority 1: Critical -->
    <g transform="translate(20, 50)">
      <rect width="380" height="70" rx="8" fill="#fef2f2" stroke="#fecaca" />
      <rect x="12" y="10" width="65" height="20" rx="4" fill="#dc2626" />
      <text x="44" y="24" text-anchor="middle" fill="#ffffff" class="badge">KRITIS</text>
      <text x="85" y="25" class="card-title">Ujian CBT Outage / Server Down</text>
      <text x="15" y="50" class="card-desc">⚡ Target Respon: &lt; 15 Mnt | Target Solusi: &lt; 2 Jam</text>
    </g>

    <!-- Priority 2: High -->
    <g transform="translate(20, 130)">
      <rect width="380" height="70" rx="8" fill="#fff7ed" stroke="#fed7aa" />
      <rect x="12" y="10" width="65" height="20" rx="4" fill="#ea580c" />
      <text x="44" y="24" text-anchor="middle" fill="#ffffff" class="badge">TINGGI</text>
      <text x="85" y="25" class="card-title">Fitur Rapor / Nilai Salah Hitung</text>
      <text x="15" y="50" class="card-desc">⚡ Target Respon: &lt; 1 Jam | Target Solusi: &lt; 8 Jam</text>
    </g>

    <!-- Priority 3: Medium -->
    <g transform="translate(20, 210)">
      <rect width="380" height="70" rx="8" fill="#fefce8" stroke="#fef08a" />
      <rect x="12" y="10" width="65" height="20" rx="4" fill="#ca8a04" />
      <text x="44" y="24" text-anchor="middle" fill="#ffffff" class="badge">SEDANG</text>
      <text x="85" y="25" class="card-title">Bug Minor Tampilan / Modul Materi</text>
      <text x="15" y="50" class="card-desc">⚡ Target Respon: &lt; 4 Jam | Target Solusi: &lt; 24 Jam</text>
    </g>

    <!-- Priority 4: Low -->
    <g transform="translate(20, 290)">
      <rect width="380" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <rect x="12" y="10" width="65" height="20" rx="4" fill="#64748b" />
      <text x="44" y="24" text-anchor="middle" fill="#ffffff" class="badge">RENDAH</text>
      <text x="85" y="25" class="card-title">Konsultasi Fitur &amp; Request Baru</text>
      <text x="15" y="50" class="card-desc">⚡ Target Respon: &lt; 12 Jam | Target Solusi: &lt; 3 Hari</text>
    </g>
  </g>
</svg>
