<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .step-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; }
      .step-desc { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #475569; }
      .badge { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc" rx="16" />

  <!-- Header -->
  <text x="40" y="45" class="title">Protokol Kriptografi Asimetris RSA-4096</text>
  <text x="40" y="68" class="subtitle">Mekanisme Penandatanganan Kunci Privat di Vendor HQ &amp; Verifikasi Offline Kunci Publik di Sekolah</text>

  <!-- ZONE 1: VENDOR CENTRAL HUB -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="420" height="345" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="0" y="0" width="420" height="40" rx="12" fill="#1e293b" />
    <rect x="0" y="25" width="420" height="15" fill="#1e293b" />
    <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">🏢 VENDOR CENTRAL HUB (PRIVATE ENVIRONMENT)</text>

    <!-- Step 1 -->
    <g transform="translate(20, 55)">
      <circle cx="15" cy="18" r="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="15" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">1</text>
      <text x="40" y="15" class="step-title">Generate Metadata Payload JSON</text>
      <text x="40" y="32" class="step-desc">NPSN, Domain, Hardware UUID, Tipe Lisensi, Fitur</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(20, 115)">
      <circle cx="15" cy="18" r="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
      <text x="15" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">2</text>
      <text x="40" y="15" class="step-title">RSA-4096 Signing (Private Key)</text>
      <text x="40" y="32" class="step-desc">Menghitung SHA-256 Hash &amp; Enkripsi Kunci Privat</text>
      <rect x="40" y="40" width="160" height="18" rx="4" fill="#fee2e2" />
      <text x="48" y="53" font-size="10" font-weight="600" fill="#991b1b">🔐 storage/keys/private.key</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(20, 200)">
      <circle cx="15" cy="18" r="14" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" />
      <text x="15" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">3</text>
      <text x="40" y="15" class="step-title">Packaging File 'aksaraedu.lic'</text>
      <text x="40" y="32" class="step-desc">Format: base64(Payload) . base64(Signature)</text>
      <rect x="40" y="40" width="340" height="35" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="50" y="62" font-family="monospace" font-size="10" fill="#0f172a">eyJhbGciOiJSUz... . eyJzaWduYXR1cmUiOi...</text>
    </g>
  </g>

  <!-- TRANSFER ARROW -->
  <g transform="translate(465, 230)">
    <path d="M 0 35 L 30 35" fill="none" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)" />
    <rect x="-10" y="0" width="55" height="20" rx="4" fill="#eff6ff" stroke="#3b82f6" />
    <text x="17" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">.LIC</text>
  </g>

  <!-- ZONE 2: LMS INSTANS SEKOLAH -->
  <g transform="translate(500, 95)" filter="url(#shadow)">
    <rect width="420" height="345" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="0" y="0" width="420" height="40" rx="12" fill="#0369a1" />
    <rect x="0" y="25" width="420" height="15" fill="#0369a1" />
    <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">🏫 LMS INSTANS SEKOLAH (CLIENT SERVER)</text>

    <!-- Step 4 -->
    <g transform="translate(20, 55)">
      <circle cx="15" cy="18" r="14" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5" />
      <text x="15" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#0284c7">4</text>
      <text x="40" y="15" class="step-title">Letakkan File di Server Sekolah</text>
      <text x="40" y="32" class="step-desc">Tersimpan di storage/license/aksaraedu.lic</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(20, 115)">
      <circle cx="15" cy="18" r="14" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5" />
      <text x="15" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#9333ea">5</text>
      <text x="40" y="15" class="step-title">Verifikasi Matematis RSA (Public Key)</text>
      <text x="40" y="32" class="step-desc">openssl_verify($payload, $signature, $publicKey)</text>
      <rect x="40" y="40" width="170" height="18" rx="4" fill="#fae8ff" />
      <text x="48" y="53" font-size="10" font-weight="600" fill="#86198f">🔓 Public Key Vendor Bawaan</text>
    </g>

    <!-- Step 6 -->
    <g transform="translate(20, 200)">
      <circle cx="15" cy="18" r="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
      <text x="15" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">6</text>
      <text x="40" y="15" class="step-title">Validasi NPSN, Domain &amp; Hardware</text>
      <text x="40" y="32" class="step-desc">Jika cocok, seluruh fitur CBT &amp; LMS aktif 100%</text>
      <rect x="40" y="45" width="340" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" />
      <text x="210" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">✅ SISTEM VALID &amp; AKTIF TANPA INTERNET</text>
    </g>
  </g>
</svg>
